spring:
  application:
    name: catalogo-auth

  datasource:
    url: jdbc:postgresql://localhost:5432/db_catalogo
    username:  
    password:  
    driver-class-name: org.postgresql.Driver

  jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect